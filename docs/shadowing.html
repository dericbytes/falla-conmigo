
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Shadowing Player</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 680px;
    margin: 40px auto;
    padding: 0 18px;
    line-height: 1.5;
    background: #f5f5f5;
    color: #222;
  }

  .player {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 2px 12px #0001;
  }

  h1 { font-size: 1.5rem; margin-top: 0; }

  button, select, input[type="file"] {
    font: inherit;
  }

  button, select {
    padding: 9px 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
  }

  button:hover { background: #e8eefc; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0;
    align-items: center;
  }

  .primary {
    background: #2458c6;
    color: white;
    border-color: #2458c6;
  }

  audio { width: 100%; margin: 12px 0; }

  .time {
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
  }

  input[type="range"] { width: 100%; }

  .section {
    border-top: 1px solid #ddd;
    padding-top: 14px;
    margin-top: 16px;
  }

  .hint { color: #666; font-size: 0.9rem; }

  .active { background: #dce8ff; border-color: #2458c6; }

  #status { min-height: 1.5em; }
</style>
</head>

<body>
<div class="player">
  <h1>Language Shadowing</h1>

  <label for="audioFile">Choose an audio file (optional)</label>
  <input id="audioFile" type="file" accept="audio/*">

  <audio id="audio" preload="metadata">
    <source src="audio/my-recording.mp3" type="audio/mpeg">
    Your browser does not support HTML audio.
  </audio>

  <div class="time">
    <span id="current">00:00</span>
    <span id="duration">00:00</span>
  </div>
  <input id="seek" type="range" min="0" max="1000"
         value="0" step="1" aria-label="Seek through audio">

  <div class="controls">
    <button id="back" title="Back 5 seconds">−5 sec</button>
    <button id="replay" class="primary">↶ Replay 5 sec</button>
    <button id="play" class="primary">▶ Play</button>
    <button id="forward" title="Forward 5 seconds">+5 sec</button>
  </div>

  <div class="section">
    <strong>Shadowing controls</strong>
    <div class="controls">
      <label for="speed">Speed:</label>
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="0.65">0.65×</option>
        <option value="0.75">0.75×</option>
        <option value="0.85">0.85×</option>
        <option value="1" selected>1× Normal</option>
        <option value="1.1">1.1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
      </select>
    </div>

    <p>Mark a sentence to repeat it continuously.</p>
    <div class="controls">
      <button id="markA">Set start A</button>
      <button id="markB">Set end B</button>
      <button id="loop" class="primary">Loop: OFF</button>
      <button id="clear">Clear marks</button>
    </div>
    <div id="marks" class="hint">A: — | B: —</div>
  </div>

  <div class="section">
    <strong>Repeat practice</strong>
    <div class="controls">
      <label for="repeats">Repeat count:</label>
      <select id="repeats">
        <option value="2">2 times</option>
        <option value="3" selected>3 times</option>
        <option value="5">5 times</option>
        <option value="10">10 times</option>
        <option value="0">Until stopped</option>
      </select>
      <button id="repeat">Repeat marked section</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <div class="section">
    <strong>Keyboard shortcuts</strong>
    <p class="hint">
      Space: play/pause · ← / →: skip 5 sec ·
      ↑ / ↓: change volume · R: replay 5 sec ·
      Escape: stop repeating
    </p>
  </div>
</div>

<script>
const audio = document.getElementById("audio");
const $ = id => document.getElementById(id);

let A = null, B = null;
let looping = false;
let repeating = false;
let completed = 0;
let targetRepeats = 3;
let previousTime = 0;
let objectURL = null;

function timeText(seconds) {
  if (!Number.isFinite(seconds)) return "00:00";
  const s = Math.floor(seconds);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  return h
    ? `${h}:${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`;
}

function seekTo(seconds) {
  if (!Number.isFinite(audio.duration)) return;
  audio.currentTime = Math.max(0, Math.min(seconds, audio.duration));
}

function update() {
  $("current").textContent = timeText(audio.currentTime);
  $("duration").textContent = timeText(audio.duration);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    $("seek").value = audio.currentTime / audio.duration * 1000;
  }

  $("play").textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function updateMarks() {
  $("marks").textContent =
    `A: ${A === null ? "—" : timeText(A)} | ` +
    `B: ${B === null ? "—" : timeText(B)}`;
}

async function togglePlay() {
  if (audio.paused) {
    try { await audio.play(); }
    catch { $("status").textContent = "Choose a valid audio file first."; }
  } else {
    audio.pause();
  }
}

$("play").addEventListener("click", togglePlay);
audio.addEventListener("play", update);
audio.addEventListener("pause", update);
audio.addEventListener("timeupdate", update);
audio.addEventListener("loadedmetadata", update);
audio.addEventListener("durationchange", update);

$("seek").addEventListener("input", () => {
  if (Number.isFinite(audio.duration)) {
    seekTo(Number($("seek").value) / 1000 * audio.duration);
  }
});

$("back").addEventListener("click", () => seekTo(audio.currentTime - 5));
$("forward").addEventListener("click", () => seekTo(audio.currentTime + 5));
$("replay").addEventListener("click", () => seekTo(audio.currentTime - 5));

$("speed").addEventListener("change", () => {
  audio.playbackRate = Number($("speed").value);
});

$("markA").addEventListener("click", () => {
  A = audio.currentTime;
  if (B !== null && B <= A) B = null;
  updateMarks();
});

$("markB").addEventListener("click", () => {
  B = audio.currentTime;
  if (A !== null && B <= A) {
    B = null;
    $("status").textContent = "End B must be after start A.";
  } else {
    $("status").textContent = "";
  }
  updateMarks();
});

$("loop").addEventListener("click", () => {
  if (A === null || B === null || B <= A) {
    $("status").textContent = "Set valid start A and end B first.";
    return;
  }
  looping = !looping;
  $("loop").textContent = `Loop: ${looping ? "ON" : "OFF"}`;
  $("loop").classList.toggle("active", looping);
});

$("clear").addEventListener("click", () => {
  A = B = null;
  looping = false;
  repeating = false;
  audio.pause();
  $("loop").textContent = "Loop: OFF";
  $("loop").classList.remove("active");
  $("repeat").textContent = "Repeat marked section";
  $("status").textContent = "";
  updateMarks();
});

function stopRepeating() {
  repeating = false;
  $("repeat").textContent = "Repeat marked section";
}

$("repeat").addEventListener("click", async () => {
  if (repeating) {
    stopRepeating();
    $("status").textContent = "Repeat stopped.";
    return;
  }

  if (A === null || B === null || B <= A) {
    $("status").textContent = "Set start A and end B first.";
    return;
  }

  repeating = true;
  completed = 0;
  targetRepeats = Number($("repeats").value);
  $("repeat").textContent = "Stop repeating";
  $("status").textContent = "Playing marked section…";
  seekTo(A);

  try { await audio.play(); }
  catch {
    stopRepeating();
    $("status").textContent = "Unable to play audio.";
  }
});

audio.addEventListener("timeupdate", () => {
  if (A === null || B === null) return;

  if (repeating && audio.currentTime >= B) {
    completed++;
    if (targetRepeats !== 0 && completed >= targetRepeats) {
      repeating = false;
      audio.pause();
      seekTo(B);
      $("status").textContent = `Finished ${completed} repetitions.`;
      $("repeat").textContent = "Repeat marked section";
    } else {
      seekTo(A);
      $("status").textContent =
        `Repetition ${completed + 1}` +
        (targetRepeats === 0 ? "" : ` of ${targetRepeats}`);
    }
  } else if (looping && !repeating && audio.currentTime >= B) {
    seekTo(A);
  }
});

audio.addEventListener("ended", () => {
  if (repeating) stopRepeating();
});

$("audioFile").addEventListener("change", () => {
  const file = $("audioFile").files[0];
  if (!file) return;

  audio.pause();
  if (objectURL) URL.revokeObjectURL(objectURL);
  objectURL = URL.createObjectURL(file);
  audio.src = objectURL;
  audio.load();

  A = B = null;
  looping = false;
  stopRepeating();
  $("loop").textContent = "Loop: OFF";
  $("loop").classList.remove("active");
  updateMarks();
  $("status").textContent = `Loaded: ${file.name}`;
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  switch (e.key) {
    case " ":
      e.preventDefault();
      togglePlay();
      break;
    case "ArrowLeft":
      e.preventDefault();
      seekTo(audio.currentTime - 5);
      break;
    case "ArrowRight":
      e.preventDefault();
      seekTo(audio.currentTime + 5);
      break;
    case "ArrowUp":
      e.preventDefault();
      audio.volume = Math.min(1, audio.volume + 0.1);
      break;
    case "ArrowDown":
      e.preventDefault();
      audio.volume = Math.max(0, audio.volume - 0.1);
      break;
    case "r":
    case "R":
      seekTo(audio.currentTime - 5);
      break;
    case "Escape":
      stopRepeating();
      looping = false;
      $("loop").textContent = "Loop: OFF";
      $("loop").classList.remove("active");
      $("status").textContent = "Repeating stopped.";
      break;
  }
});

update();
</script>
</body>
</html>
